name: Analyze TV diagnostic report
on:
  issues:
    types: [opened, edited]
permissions:
  contents: read
  issues: write
concurrency:
  group: vetro-log-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  analyze:
    if: startsWith(github.event.issue.title, '[Log report]') && contains(github.event.issue.body, '### Vetro diagnostic report')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out trusted default-branch parser
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Parse report without access to the comment token
        run: python3 .github/scripts/parse_log.py --event "$GITHUB_EVENT_PATH" --output /tmp/vetro-comment.md
      - name: Post or update the analysis comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/post_log_comment.py --event "$GITHUB_EVENT_PATH" --comment /tmp/vetro-comment.md
